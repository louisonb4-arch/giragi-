<section class="hero" id="accueil">
  <div class="hero__facade">
    <p class="hero__kicker k">Place Saint-Clair · Nantes</p>
    <div class="sign" data-paint>{{@ logoPaint}}</div>
  </div>
  <div class="hero__text">
    <h1 class="sr-only">Giragi, bistrot et cave à manger de quartier, place Saint-Clair à Nantes</h1>
    <p class="sub">Bistrot le midi, cave à manger le soir.<br>Cuisine de saison, vins du coin.</p>
  </div>
  <figure class="hero__photo" data-reveal>
    <picture>
      <source media="(max-width: 899px)" srcset="/img/smores-640.webp">
      <img src="/img/smores.webp" width="1080" height="1440" alt="S'mores nantais : guimauve maison grillée et ganache chocolat, sur un plat en métal" fetchpriority="high">
    </picture>
    <img class="hero__more" src="/img/fenouils-640.webp" width="640" height="800" loading="lazy" alt="Fenouils rôtis, salsa harissa-orange, stracciatella et dukkah, posés sur un tabouret en bois">
    <img class="hero__more" src="/img/pain-640.webp" width="640" height="800" loading="lazy" alt="Le pain-huile d'olive maison, doré au four">
  </figure>
  <div class="hero__cta">
    <div class="hero__actions">
      <a class="btn btn--dark" href="{{ infos.reservation.url }}" target="_blank" rel="noopener">Réserver une table</a>
      <a class="btn btn--line" href="tel:{{ infos.telephone.lien }}">Appeler</a>
    </div>
    <div class="hero__hours">{{@ heroHours}}</div>
  </div>
</section>
