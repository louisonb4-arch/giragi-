<section class="avis" id="avis" aria-labelledby="avis-title">
  <header class="sec-head">
    <p class="kicker" data-reveal>05 · Ce qu'on en dit</p>
    <h2 class="h2" id="avis-title" data-wobble>L'addition, côté clients.</h2>
  </header>
  <div class="printer" data-printer>
    <div class="printer__slot" aria-hidden="true"></div>
    <div class="printer__out">
      <div class="receipt">
        <span class="logo-mask receipt__logo" role="img" aria-label="Giragi"></span>
        <p class="receipt__center">{{ infos.adresse.rue }}<br>{{ infos.adresse.cp }} {{ infos.adresse.ville }}</p>
        <p class="receipt__sep" aria-hidden="true"></p>
        <p class="receipt__center"><b>Avis clients</b></p>
        {{@ receipt}}
        <p class="receipt__sep" aria-hidden="true"></p>
        <p class="receipt__small">Extraits d'avis Google publics, reproduits sans modification, non vérifiés par Giragi.</p>
        <p class="receipt__barcode" aria-hidden="true"></p>
        <p class="receipt__center"><b>Merci, à bientôt !</b></p>
      </div>
    </div>
  </div>
  <a class="link avis__all" href="{{ infos.google.url }}" target="_blank" rel="noopener">Lire tous les avis sur Google</a>
</section>
