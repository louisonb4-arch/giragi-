<section class="infos c" id="infos" aria-labelledby="infos-title">
  <span class="k" data-reveal>Venir</span>
  <h2 class="hand" id="infos-title" data-reveal>On est ouvert ?</h2>
  <p class="sub" data-reveal>{{ infos.adresse.rue }}, {{ infos.adresse.cp }} {{ infos.adresse.ville }}. {{ infos.adresse.repere }}.</p>
  <div class="infos__grid">
    <div>
      <div class="today" data-today data-reveal>
        <span class="k" data-today-label>Horaires</span>
        <p class="hand" data-today-title>Midi et soir, du mardi au samedi</p>
        <div class="today__sv" data-today-sv hidden></div>
        <a class="btn btn--cream" href="{{ infos.reservation.url }}" target="_blank" rel="noopener">Réserver une table</a>
      </div>
      {{@ semaine}}
    </div>
    <figure class="map" data-reveal>
      <a href="{{ infos.adresse.itineraire }}" target="_blank" rel="noopener" aria-label="Itinéraire vers Giragi sur Google Maps">
        <img src="/img/plan.webp" width="840" height="660" loading="lazy" alt="Plan du quartier : Giragi est place Saint-Clair, face à l'église">
        <span class="map__pin" aria-hidden="true"><span class="logo-mask"></span></span>
      </a>
      <div class="map__bar"><span><b>{{ infos.adresse.rue }}</b><br><a href="tel:{{ infos.telephone.lien }}">{{ infos.telephone.affiche }}</a></span><a class="btn btn--dark" href="{{ infos.adresse.itineraire }}" target="_blank" rel="noopener">Y aller</a></div>
      <figcaption>Plan © contributeurs OpenStreetMap</figcaption>
    </figure>
  </div>
</section>
