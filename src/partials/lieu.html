<section class="lieu c" id="lieu" aria-labelledby="lieu-title">
  <span class="k" data-reveal>Le lieu</span>
  <h2 class="hand" id="lieu-title" data-reveal>Trois façons de s'attabler !</h2>
  <div class="lieu__grid">
    <figure class="lieu__big" data-reveal>
      <div class="ph"><img src="/img/terrasse-640.webp" srcset="/img/terrasse-640.webp 640w, /img/terrasse.webp 1080w" sizes="(min-width: 900px) 40vw, 90vw" width="1080" height="1440" loading="lazy" alt="La terrasse de Giragi sur la place, tables hautes et fleurs"></div>
      <figcaption><em>La terrasse, côté place</em><span>Face à l'église, au calme, comme sur une place de village.</span></figcaption>
    </figure>
    <figure data-reveal style="--i:1">
      <div class="ph"><img src="/img/comptoir-640.webp" srcset="/img/comptoir-640.webp 640w, /img/comptoir.webp 1080w" sizes="(min-width: 900px) 25vw, 45vw" width="1080" height="1440" loading="lazy" alt="Le comptoir et la salle de Giragi, étagères de bouteilles et tabourets"></div>
      <figcaption><em>La salle</em><span>Tables hautes, comptoir, banquettes.</span></figcaption>
    </figure>
    <figure data-reveal style="--i:2">
      <div class="ph ph--draw" aria-hidden="true"><svg viewBox="0 0 100 80"><path d="M14 70c22-4 36-20 38-48M52 22c10 16 22 24 38 26M34 74c2-14 10-24 24-28M20 38c10 2 16 6 18 16"/></svg><small>Photo à venir</small></div>
      <figcaption><em>La cour</em><span>À l'ombre de la végétation.</span></figcaption>
    </figure>
  </div>
  <aside class="groups" data-reveal>
    <span class="k">Privat' &amp; groupes</span>
    <h3 class="hand">Une grande tablée ?</h3>
    <p>Giragi accueille les groupes {{ infos.groupes.capacite }}, {{ infos.groupes.jours }}. Formules dès {{ infos.groupes.prixDes }}, à manger et à boire.</p>
    <a class="btn btn--cream" href="mailto:{{ infos.email.adresse }}?subject=Privatisation%20Giragi">Écrire à l'équipe</a>
  </aside>
</section>
